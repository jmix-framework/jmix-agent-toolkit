name: Lint skills

on:
  push:
    branches: [ 'v[0-9]*' ]
    paths:
      - 'content/skills/**'
      - 'tests/check_skill_frontmatter.py'
      - '.github/workflows/skills-lint.yml'
  pull_request:
    paths:
      - 'content/skills/**'
      - 'tests/check_skill_frontmatter.py'
      - '.github/workflows/skills-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Strict YAML frontmatter
        run: |
          pip install pyyaml
          python3 tests/check_skill_frontmatter.py
